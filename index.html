<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription et Connexion</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .switch {
            text-align: center;
            margin-top: 15px;
        }
        .switch a {
            color: #4CAF50;
            text-decoration: none;
        }
        .success-message {
            color: green;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
        .error-message {
            color: red;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container" id="register-form">
            <h2>Inscription</h2>
            <div class="form-group">
                <label for="register-username">Nom d'utilisateur</label>
                <input type="text" id="register-username" required>
            </div>
            <div class="form-group">
                <label for="register-email">Email</label>
                <input type="email" id="register-email" required>
            </div>
            <div class="form-group">
                <label for="register-password">Mot de passe</label>
                <input type="password" id="register-password" required>
            </div>
            <div class="form-group">
                <label for="register-confirm-password">Confirmer le mot de passe</label>
                <input type="password" id="register-confirm-password" required>
            </div>
            <button onclick="register()">S'inscrire</button>
            <div class="switch">
                Déjà un compte? <a href="#" onclick="toggleForms()">Se connecter</a>
            </div>
            <div class="success-message" id="register-success">Inscription réussie! Vous pouvez maintenant vous connecter.</div>
            <div class="error-message" id="register-error"></div>
        </div>

        <div class="form-container" id="login-form" style="display: none;">
            <h2>Connexion</h2>
            <div class="form-group">
                <label for="login-username">Nom d'utilisateur</label>
                <input type="text" id="login-username" required>
            </div>
            <div class="form-group">
                <label for="login-password">Mot de passe</label>
                <input type="password" id="login-password" required>
            </div>
            <button onclick="login()">Se connecter</button>
            <div class="switch">
                Pas de compte? <a href="#" onclick="toggleForms()">S'inscrire</a>
            </div>
            <div class="success-message" id="login-success">Connexion réussie!</div>
            <div class="error-message" id="login-error"></div>
        </div>

        <div class="form-container" id="welcome-page" style="display: none;">
            <h2>Bienvenue!</h2>
            <p style="text-align: center;">Vous êtes connecté avec succès.</p>
            <button onclick="logout()">Déconnexion</button>
        </div>
    </div>

    <script>
        // Stockage des utilisateurs simulé (localStorage)
        function getUsers() {
            const users = localStorage.getItem('users');
            return users ? JSON.parse(users) : [];
        }

        function saveUser(user) {
            const users = getUsers();
            users.push(user);
            localStorage.setItem('users', JSON.stringify(users));
        }

        // Basculer entre les formulaires d'inscription et de connexion
        function toggleForms() {
            const registerForm = document.getElementById('register-form');
            const loginForm = document.getElementById('login-form');
            const welcomePage = document.getElementById('welcome-page');
            
            if (registerForm.style.display === 'none') {
                registerForm.style.display = 'block';
                loginForm.style.display = 'none';
                welcomePage.style.display = 'none';
            } else {
                registerForm.style.display = 'none';
                loginForm.style.display = 'block';
                welcomePage.style.display = 'none';
            }
            
            // Réinitialiser les messages d'erreur et de succès
            document.getElementById('register-success').style.display = 'none';
            document.getElementById('register-error').style.display = 'none';
            document.getElementById('login-success').style.display = 'none';
            document.getElementById('login-error').style.display = 'none';
        }

        // Fonction d'inscription
        function register() {
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;
            
            const registerSuccess = document.getElementById('register-success');
            const registerError = document.getElementById('register-error');
            
            // Réinitialiser les messages
            registerSuccess.style.display = 'none';
            registerError.style.display = 'none';
            
            // Validation des champs
            if (!username || !email || !password || !confirmPassword) {
                registerError.textContent = 'Veuillez remplir tous les champs';
                registerError.style.display = 'block';
                return;
            }
            
            // Vérification du format de l'email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                registerError.textContent = 'Format d\'email invalide';
                registerError.style.display = 'block';
                return;
            }
            
            // Vérification que les mots de passe correspondent
            if (password !== confirmPassword) {
                registerError.textContent = 'Les mots de passe ne correspondent pas';
                registerError.style.display = 'block';
                return;
            }
            
            // Vérifier si l'utilisateur existe déjà
            const users = getUsers();
            if (users.some(user => user.username === username)) {
                registerError.textContent = 'Ce nom d\'utilisateur existe déjà';
                registerError.style.display = 'block';
                return;
            }
            
            if (users.some(user => user.email === email)) {
                registerError.textContent = 'Cet email est déjà utilisé';
                registerError.style.display = 'block';
                return;
            }
            
            // Enregistrer l'utilisateur
            const user = {
                username,
                email,
                password // Note: Dans un vrai site, il faudrait hacher le mot de passe
            };
            
            saveUser(user);
            
            // Afficher le message de succès
            registerSuccess.style.display = 'block';
            
            // Réinitialiser le formulaire
            document.getElementById('register-username').value = '';
            document.getElementById('register-email').value = '';
            document.getElementById('register-password').value = '';
            document.getElementById('register-confirm-password').value = '';
            
            // Rediriger vers le formulaire de connexion après 2 secondes
            setTimeout(() => {
                toggleForms();
            }, 2000);
        }

        // Fonction de connexion
        function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            const loginSuccess = document.getElementById('login-success');
            const loginError = document.getElementById('login-error');
            
            // Réinitialiser les messages
            loginSuccess.style.display = 'none';
            loginError.style.display = 'none';
            
            // Validation des champs
            if (!username || !password) {
                loginError.textContent = 'Veuillez remplir tous les champs';
                loginError.style.display = 'block';
                return;
            }
            
            // Vérifier les identifiants
            const users = getUsers();
            const user = users.find(u => u.username === username && u.password === password);
            
            if (!user) {
                loginError.textContent = 'Nom d\'utilisateur ou mot de passe incorrect';
                loginError.style.display = 'block';
                return;
            }
            
            // Connexion réussie
            loginSuccess.style.display = 'block';
            
            // Enregistrer la session
            sessionStorage.setItem('currentUser', JSON.stringify(user));
            
            // Rediriger vers la page de bienvenue
            setTimeout(() => {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('welcome-page').style.display = 'block';
            }, 1000);
        }

        // Fonction de déconnexion
        function logout() {
            sessionStorage.removeItem('currentUser');
            document.getElementById('welcome-page').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
            
            // Réinitialiser le formulaire de connexion
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
        }

        // Vérifier si l'utilisateur est déjà connecté
        window.onload = function() {
            const currentUser = sessionStorage.getItem('currentUser');
            if (currentUser) {
                document.getElementById('register-form').style.display = 'none';
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('welcome-page').style.display = 'block';
            }
        };
    </script>
</body>
</html>
